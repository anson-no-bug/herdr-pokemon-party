<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Crisp 16x16 GBA Pixel-Art Master Ball -->
  <!-- Dark pixel silhouette outline -->
  <rect x="5" y="1" width="6" height="1" fill="#1e1b4b"/>
  <rect x="3" y="2" width="2" height="1" fill="#1e1b4b"/>
  <rect x="11" y="2" width="2" height="1" fill="#1e1b4b"/>
  <rect x="2" y="3" width="1" height="2" fill="#1e1b4b"/>
  <rect x="13" y="3" width="1" height="2" fill="#1e1b4b"/>
  <rect x="1" y="5" width="1" height="6" fill="#1e1b4b"/>
  <rect x="14" y="5" width="1" height="6" fill="#1e1b4b"/>
  <rect x="2" y="11" width="1" height="2" fill="#1e1b4b"/>
  <rect x="13" y="11" width="1" height="2" fill="#1e1b4b"/>
  <rect x="3" y="13" width="2" height="1" fill="#1e1b4b"/>
  <rect x="11" y="13" width="2" height="1" fill="#1e1b4b"/>
  <rect x="5" y="14" width="6" height="1" fill="#1e1b4b"/>

  <!-- Purple top dome -->
  <rect x="5" y="2" width="6" height="6" fill="#7c3aed"/>
  <rect x="3" y="3" width="10" height="5" fill="#7c3aed"/>
  <rect x="2" y="5" width="12" height="3" fill="#6d28d9"/>
  <!-- Dome top highlight -->
  <rect x="5" y="2" width="5" height="1" fill="#a78bfa"/>
  <!-- Iconic Magenta-Pink Master Ball side wings -->
  <rect x="3" y="3" width="2" height="3" fill="#ec4899"/>
  <rect x="2" y="5" width="2" height="1" fill="#db2777"/>
  <rect x="11" y="3" width="2" height="3" fill="#ec4899"/>
  <rect x="12" y="5" width="2" height="1" fill="#db2777"/>
  <rect x="3" y="3" width="1" height="1" fill="#f9a8d4"/>
  <rect x="11" y="3" width="1" height="1" fill="#f9a8d4"/>
  <!-- Crisp White Pixel 'M' emblem -->
  <rect x="6" y="4" width="1" height="3" fill="#ffffff"/>
  <rect x="9" y="4" width="1" height="3" fill="#ffffff"/>
  <rect x="7" y="4" width="2" height="1" fill="#ffffff"/>
  <rect x="7" y="5" width="2" height="1" fill="#e9d5ff"/>

  <!-- Lower white hemisphere with GBA shading -->
  <rect x="2" y="9" width="12" height="2" fill="#f8fafc"/>
  <rect x="3" y="11" width="10" height="2" fill="#e2e8f0"/>
  <rect x="5" y="13" width="6" height="1" fill="#cbd5e1"/>
  <rect x="3" y="9" width="3" height="2" fill="#ffffff"/>

  <!-- Dark equator belt -->
  <rect x="2" y="8" width="12" height="1" fill="#1e1b4b"/>
  <!-- Center capture button -->
  <rect x="6" y="7" width="4" height="3" fill="#1e1b4b"/>
  <rect x="7" y="7" width="2" height="3" fill="#ffffff"/>
  <rect x="6" y="8" width="4" height="1" fill="#ffffff"/>
  <rect x="7" y="8" width="2" height="1" fill="#f0abfc"/>
</svg>
