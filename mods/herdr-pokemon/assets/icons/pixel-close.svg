<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Classic GBA pixel-stepped cream frame with dark ink outline -->
  <rect x="2" y="0" width="12" height="1" fill="#2e443c"/>
  <rect x="1" y="1" width="1" height="1" fill="#2e443c"/>
  <rect x="14" y="1" width="1" height="1" fill="#2e443c"/>
  <rect x="0" y="2" width="1" height="12" fill="#2e443c"/>
  <rect x="15" y="2" width="1" height="12" fill="#2e443c"/>
  <rect x="1" y="14" width="1" height="1" fill="#2e443c"/>
  <rect x="14" y="14" width="1" height="1" fill="#2e443c"/>
  <rect x="2" y="15" width="12" height="1" fill="#2e443c"/>

  <!-- Cream parchment fill -->
  <rect x="2" y="1" width="12" height="14" fill="#f8f8e8"/>
  <rect x="1" y="2" width="14" height="12" fill="#f8f8e8"/>

  <!-- GBA top-left highlight & bottom-right shadow bevel -->
  <rect x="2" y="1" width="12" height="1" fill="#ffffff"/>
  <rect x="1" y="2" width="1" height="11" fill="#ffffff"/>
  <rect x="2" y="13" width="12" height="1" fill="#c7ccb4"/>
  <rect x="13" y="2" width="1" height="12" fill="#c7ccb4"/>

  <!-- Crisp pixel X with drop shadow -->
  <path d="M5 5h2v1h1v1h2V6h1V5h2v2h-1v1h-1v2h1v1h1v2h-2v-1h-1v-1H8v1H7v1H5v-2h1v-1h1V8H6V7H5V5z" fill="#7f1d1d" transform="translate(0,1)" opacity="0.35"/>
  <rect x="4" y="4" width="2" height="2" fill="#dc2626"/>
  <rect x="10" y="4" width="2" height="2" fill="#dc2626"/>
  <rect x="5" y="5" width="2" height="2" fill="#ef4444"/>
  <rect x="9" y="5" width="2" height="2" fill="#ef4444"/>
  <rect x="6" y="6" width="4" height="4" fill="#dc2626"/>
  <rect x="7" y="7" width="2" height="2" fill="#ef4444"/>
  <rect x="5" y="9" width="2" height="2" fill="#dc2626"/>
  <rect x="9" y="9" width="2" height="2" fill="#dc2626"/>
  <rect x="4" y="10" width="2" height="2" fill="#b91c1c"/>
  <rect x="10" y="10" width="2" height="2" fill="#b91c1c"/>
</svg>
